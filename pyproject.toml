[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["venv", ".venv", "frontend", "**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["api", "backend", "recipes", "users"]

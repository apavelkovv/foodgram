name: foodgram
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file: .env
    environment:
      USE_SQLITE: 'False'
      DB_HOST: db
    volumes:
      - backend_static:/app/collected_static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    volumes:
      - frontend_build:/frontend
  nginx:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-nginx:${IMAGE_TAG:?Set IMAGE_TAG}
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
      - backend_static:/var/html/static:ro
      - media:/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  backend_static:
  frontend_build:
  media:
